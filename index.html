<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>영단어 스펠링 연습 - Unit 24~60</title>
<style>
  :root {
    --cream: #FFF8ED;
    --navy: #2B3A55;
    --coral: #FF6B5B;
    --mint: #3CB4A4;
    --yellow: #FFC94A;
    --ink: #2B3A55;
  }

- { box-sizing: border-box; }

html {
height: -webkit-fill-available;
}

body {
margin: 0;
font-family: -apple-system, ‘SF Pro Text’, system-ui, sans-serif;
background: var(–cream);
background-image:
radial-gradient(circle at 10% 10%, rgba(255,201,74,0.15) 0%, transparent 35%),
radial-gradient(circle at 90% 90%, rgba(60,180,164,0.12) 0%, transparent 35%);
color: var(–ink);
min-height: 100vh;
min-height: -webkit-fill-available;
min-height: 100dvh;
min-height: var(–vh-actual, 100dvh);
padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
display: flex;
flex-direction: column;
overflow-y: auto;
}

.wrap {
max-width: 560px;
width: 100%;
margin: 0 auto;
display: flex;
flex-direction: column;
flex: 1;
}

header {
text-align: center;
margin-bottom: 16px;
flex-shrink: 0;
}

h1 {
font-family: -apple-system, ‘SF Pro Display’, system-ui, sans-serif;
font-size: 24px;
font-weight: 800;
margin: 0 0 4px;
color: var(–navy);
}

.sub {
font-size: 14px;
color: #6b7690;
font-weight: 600;
}

/* ––––– Unit selection screen ––––– */
.select-screen {
background: #fff;
border-radius: 24px;
padding: 20px 18px;
box-shadow: 0 10px 30px rgba(43,58,85,0.08);
border: 2px solid #F0E9D8;
}

.select-toolbar {
display: flex;
gap: 8px;
margin-bottom: 14px;
}

.toolbar-btn {
flex: 1;
background: var(–cream);
border: 2px solid #E8E2D4;
color: var(–navy);
font-size: 13px;
font-weight: 700;
padding: 10px 8px;
border-radius: 12px;
}
.toolbar-btn:active { transform: scale(0.96); }

.unit-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 8px;
margin-bottom: 18px;
}

.unit-chip {
position: relative;
}
.unit-chip input {
position: absolute;
opacity: 0;
width: 100%;
height: 100%;
margin: 0;
cursor: pointer;
}
.unit-chip label {
display: flex;
align-items: center;
justify-content: center;
padding: 10px 4px;
border-radius: 12px;
border: 2px solid #E8E2D4;
background: var(–cream);
color: #8a93ab;
font-weight: 800;
font-size: 14px;
transition: all 0.15s;
}
.unit-chip input:checked + label {
background: var(–navy);
border-color: var(–navy);
color: #fff;
}

.selection-summary {
font-size: 14px;
font-weight: 700;
color: var(–navy);
text-align: center;
margin-bottom: 14px;
min-height: 20px;
}
.selection-summary .count {
color: var(–coral);
}

.btn-start {
background: var(–coral);
color: #fff;
width: 100%;
font-size: 17px;
padding: 16px;
}
.btn-start:disabled {
background: #E8E2D4;
color: #b8bfd0;
}

/* ––––– Quiz screen (reused) ––––– */
.progress-bar {
width: 100%;
height: 10px;
background: #E8E2D4;
border-radius: 20px;
overflow: hidden;
margin: 0 0 6px;
flex-shrink: 0;
}
.progress-fill {
height: 100%;
background: linear-gradient(90deg, var(–mint), var(–coral));
width: 0%;
transition: width 0.4s ease;
}
.progress-label {
font-size: 13px;
font-weight: 700;
color: #8a93ab;
text-align: right;
}

.back-row {
display: flex;
justify-content: flex-start;
margin-bottom: 8px;
flex-shrink: 0;
}
.btn-back {
background: none;
border: none;
color: #8a93ab;
font-size: 14px;
font-weight: 700;
padding: 4px 0;
}

.card {
background: #fff;
border-radius: 24px;
padding: 24px 20px;
box-shadow: 0 10px 30px rgba(43,58,85,0.08);
border: 2px solid #F0E9D8;
position: relative;
flex-shrink: 0;
}

.unit-tag {
display: inline-block;
font-family: -apple-system, ‘SF Pro Display’, system-ui, sans-serif;
font-size: 12px;
font-weight: 700;
color: #fff;
background: var(–navy);
padding: 4px 12px;
border-radius: 20px;
margin-bottom: 16px;
}

.meaning {
font-size: 22px;
font-weight: 800;
line-height: 1.4;
margin-bottom: 6px;
color: var(–navy);
}

.example-kr {
font-size: 13px;
color: #8a93ab;
font-weight: 600;
margin-bottom: 18px;
line-height: 1.5;
}

.input-row {
display: flex;
flex-direction: column;
gap: 10px;
margin-bottom: 12px;
}

input[type=“text”] {
width: 100%;
font-size: 20px;
font-family: -apple-system, ‘SF Pro Text’, system-ui, sans-serif;
font-weight: 700;
padding: 14px 16px;
border-radius: 14px;
border: 3px solid #E8E2D4;
outline: none;
background: var(–cream);
color: var(–navy);
transition: border-color 0.2s;
}
input[type=“text”]:focus {
border-color: var(–mint);
}
input[type=“text”].wrong-shake {
border-color: var(–coral);
animation: shake 0.3s;
}
input[type=“text”].correct-glow {
border-color: var(–mint);
background: #E9FBF7;
}

@keyframes shake {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-6px); }
75% { transform: translateX(6px); }
}

button {
font-family: -apple-system, ‘SF Pro Display’, system-ui, sans-serif;
font-weight: 700;
font-size: 15px;
border: none;
border-radius: 14px;
padding: 14px 20px;
cursor: pointer;
transition: transform 0.15s, box-shadow 0.15s;
}
button:active { transform: scale(0.96); }

.btn-check {
background: var(–navy);
color: #fff;
width: 100%;
}
.btn-check:hover { box-shadow: 0 4px 14px rgba(43,58,85,0.3); }

.feedback {
min-height: 28px;
font-weight: 700;
font-size: 15px;
margin-top: 4px;
}
.feedback.correct { color: var(–mint); }
.feedback.incorrect { color: var(–coral); }

.footer-row {
display: flex;
justify-content: space-between;
align-items: center;
margin-top: 18px;
}

.stats {
font-size: 13px;
color: #8a93ab;
font-weight: 700;
}
.stats span { color: var(–coral); }

.done-screen {
text-align: center;
padding: 20px 0;
}
.done-screen .big-emoji {
font-size: 56px;
margin-bottom: 8px;
}
.done-screen h2 {
font-family: -apple-system, ‘SF Pro Display’, system-ui, sans-serif;
color: var(–navy);
margin: 0 0 6px;
}
.done-screen p {
color: #6b7690;
font-weight: 600;
margin-bottom: 20px;
}

.retry-list {
text-align: left;
background: var(–cream);
border-radius: 14px;
padding: 12px 16px;
margin-bottom: 20px;
font-size: 14px;
max-height: 260px;
overflow-y: auto;
}
.retry-list div {
padding: 6px 0;
border-bottom: 1px dashed #E8E2D4;
display: flex;
justify-content: space-between;
gap: 10px;
font-weight: 700;
}
.retry-list div:last-child { border-bottom: none; }
.retry-list .word { color: var(–navy); flex-shrink: 0; }
.retry-list .kr { color: #8a93ab; font-weight: 600; text-align: right; }

.btn-restart {
background: var(–coral);
color: #fff;
width: 100%;
}

.btn-review {
background: var(–mint);
color: #fff;
width: 100%;
margin-bottom: 10px;
}

.btn-pick-again {
background: none;
border: 2px solid #E8E2D4;
color: #8a93ab;
width: 100%;
margin-top: 10px;
font-size: 13px;
padding: 10px;
}

body.keyboard-open header,
body.keyboard-open .progress-bar,
body.keyboard-open .progress-label,
body.keyboard-open .back-row {
display: none;
}
body.keyboard-open .card {
padding: 10px 14px;
}
body.keyboard-open .unit-tag {
margin-bottom: 6px;
padding: 3px 10px;
font-size: 11px;
}
body.keyboard-open .meaning {
font-size: 17px;
margin-bottom: 2px;
}
body.keyboard-open .example-kr {
display: none;
}
body.keyboard-open .input-row {
gap: 6px;
margin-bottom: 6px;
}
body.keyboard-open input[type=“text”] {
padding: 8px 12px;
font-size: 17px;
}
body.keyboard-open button {
padding: 8px 14px;
font-size: 14px;
}
body.keyboard-open .feedback {
min-height: 0;
font-size: 13px;
}
body.keyboard-open .footer-row {
margin-top: 4px;
}
body.keyboard-open .wrap {
justify-content: flex-start;
}

.hidden { display: none !important; }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>✏️ 영단어 스펠링 연습</h1>
    <div class="sub" id="subTitle">Unit 24~60 · 원하는 유닛을 골라 시작하세요</div>
  </header>

  <!-- Unit selection screen -->

  <div class="select-screen" id="selectScreen">
    <div class="select-toolbar">
      <button class="toolbar-btn" id="selectAllBtn">전체 선택</button>
      <button class="toolbar-btn" id="clearAllBtn">전체 해제</button>
    </div>
    <div class="unit-grid" id="unitGrid"></div>
    <div class="selection-summary" id="selectionSummary">유닛을 선택하세요</div>
    <button class="btn-start" id="startBtn" disabled>시작하기</button>
  </div>

  <!-- Quiz screen -->

  <div id="quizScreen" class="hidden">
    <div class="back-row">
      <button class="btn-back" id="backBtn">‹ 유닛 다시 선택</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
    <div class="card" id="quizCard"></div>
  </div>
</div>

{unit:60, word:"beat", meaning:"때리다, 치다, 맞추다", example:"북을 치다 / 박자를 맞추다"},
];


// ---------- App logic ----------
const ALL_UNITS = [...new Set(WORDS.map(w => w.unit))].sort((a,b) => a - b);

let queue = [];
let currentIndex = 0;
let correctCount = 0;
let wrongWords = [];
let totalCount = 0;
let selectedUnits = new Set();

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ----- Unit selection screen -----
function buildUnitGrid() {
  const grid = document.getElementById("unitGrid");
  grid.innerHTML = ALL_UNITS.map(u => `
    <div class="unit-chip">
      <input type="checkbox" id="u${u}" data-unit="${u}">
      <label for="u${u}">${u}</label>
    </div>
  `).join("");

  grid.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", () => {
      const unit = Number(cb.dataset.unit);
      if (cb.checked) selectedUnits.add(unit);
      else selectedUnits.delete(unit);
      updateSelectionSummary();
    });
  });
}

function updateSelectionSummary() {
  const summary = document.getElementById("selectionSummary");
  const startBtn = document.getElementById("startBtn");
  const count = selectedUnits.size;
  const wordCount = WORDS.filter(w => selectedUnits.has(w.unit)).length;

  if (count === 0) {
    summary.innerHTML = "유닛을 선택하세요";
    startBtn.disabled = true;
  } else {
    summary.innerHTML = `<span class="count">${count}개 유닛</span> 선택됨 · 단어 ${wordCount}개`;
    startBtn.disabled = false;
  }
}

document.getElementById("selectAllBtn").addEventListener("click", () => {
  selectedUnits = new Set(ALL_UNITS);
  document.querySelectorAll('#unitGrid input[type="checkbox"]').forEach(cb => cb.checked = true);
  updateSelectionSummary();
});

document.getElementById("clearAllBtn").addEventListener("click", () => {
  selectedUnits = new Set();
  document.querySelectorAll('#unitGrid input[type="checkbox"]').forEach(cb => cb.checked = false);
  updateSelectionSummary();
});

document.getElementById("startBtn").addEventListener("click", () => {
  const pool = WORDS.filter(w => selectedUnits.has(w.unit));
  startQuiz(pool);
});

document.getElementById("backBtn").addEventListener("click", () => {
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("selectScreen").classList.remove("hidden");
  document.getElementById("subTitle").textContent = "Unit 24~60 · 원하는 유닛을 골라 시작하세요";
});

// ----- Quiz screen -----
function startQuiz(pool) {
  queue = shuffle(pool);
  totalCount = queue.length;
  currentIndex = 0;
  correctCount = 0;
  wrongWords = [];

  document.getElementById("selectScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");

  const unitsUsed = [...new Set(pool.map(w => w.unit))].sort((a,b) => a - b);
  const unitLabel = unitsUsed.length === 1
    ? `Unit ${unitsUsed[0]}`
    : `Unit ${unitsUsed[0]}~${unitsUsed[unitsUsed.length - 1]} (${unitsUsed.length}개 유닛)`;
  document.getElementById("subTitle").textContent = `${unitLabel} · 총 ${totalCount}개 단어`;

  renderCard();
  updateProgress();
}

function updateProgress() {
  const fill = document.getElementById("progressFill");
  const label = document.getElementById("progressLabel");
  const done = currentIndex;
  const pct = totalCount ? (done / totalCount) * 100 : 0;
  fill.style.width = pct + "%";
  label.textContent = done + " / " + totalCount;
}

function renderCard() {
  const card = document.getElementById("quizCard");
  document.body.classList.remove("keyboard-open");

  if (currentIndex >= queue.length) {
    renderDone();
    return;
  }

  const item = queue[currentIndex];
  card.innerHTML = `
    <span class="unit-tag">Unit ${item.unit}</span>
    <div class="meaning">${item.meaning}</div>
    <div class="example-kr">${item.example}</div>
    <div class="input-row">
      <input type="text" id="answerInput" placeholder="영어 스펠링을 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="btn-check" id="checkBtn">확인</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="footer-row">
      <div class="stats">맞음 <span>${correctCount}</span> / 남음 ${queue.length - currentIndex}</div>
    </div>
  `;

  const input = document.getElementById("answerInput");
  const checkBtn = document.getElementById("checkBtn");

  input.addEventListener("focus", () => {
    document.body.classList.add("keyboard-open");
    setTimeout(() => { window.scrollTo(0, 0); }, 300);
  });
  input.addEventListener("blur", () => {
    setTimeout(() => {
      if (document.activeElement !== input) {
        document.body.classList.remove("keyboard-open");
      }
    }, 200);
  });

  const handleCheckPress = (e) => {
    e.preventDefault();
    checkAnswer();
  };
  checkBtn.addEventListener("touchstart", handleCheckPress, { passive: false });
  checkBtn.addEventListener("mousedown", handleCheckPress);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") checkAnswer();
  });
}

function normalize(str) {
  return str.trim().toLowerCase().replace(/\s+/g, " ");
}

function checkAnswer() {
  const item = queue[currentIndex];
  const input = document.getElementById("answerInput");
  const feedback = document.getElementById("feedback");
  const userAnswer = normalize(input.value);
  const correctAnswer = normalize(item.word);

  if (!input.value.trim()) return;

  const wasKeyboardOpen = document.body.classList.contains("keyboard-open");

  if (userAnswer === correctAnswer) {
    correctCount++;
    input.classList.remove("wrong-shake");
    input.classList.add("correct-glow");
    input.disabled = true;
    if (wasKeyboardOpen) document.body.classList.add("keyboard-open");
    feedback.textContent = "🎉 정답이에요! " + item.word;
    feedback.className = "feedback correct";
    document.getElementById("checkBtn").disabled = true;
    setTimeout(() => {
      currentIndex++;
      updateProgress();
      renderCard();
    }, 900);
  } else {
    wrongWords.push(item);
    input.classList.remove("correct-glow");
    input.classList.add("wrong-shake");
    input.disabled = true;
    if (wasKeyboardOpen) document.body.classList.add("keyboard-open");
    feedback.innerHTML = `❌ 정답은 <b>${item.word}</b> 이었어요`;
    feedback.className = "feedback incorrect";
    document.getElementById("checkBtn").disabled = true;
    setTimeout(() => {
      currentIndex++;
      updateProgress();
      renderCard();
    }, 1400);
  }
}

function renderDone() {
  const card = document.getElementById("quizCard");
  const uniqueWrong = [...new Map(wrongWords.map(w => [w.word, w])).values()];

  let retryHtml = "";
  if (uniqueWrong.length > 0) {
    retryHtml = `
      <div class="retry-list">
        ${uniqueWrong.map(w => `<div><span class="word">${w.word}</span><span class="kr">${w.meaning}</span></div>`).join("")}
      </div>
    `;
  }

  card.innerHTML = `
    <div class="done-screen">
      <div class="big-emoji">${uniqueWrong.length === 0 ? "🏆" : "✨"}</div>
      <h2>${uniqueWrong.length === 0 ? "완벽해요!" : "수고했어요!"}</h2>
      <p>${totalCount}개 중 첫 시도에 ${totalCount - uniqueWrong.length}개 정답</p>
      ${uniqueWrong.length > 0 ? "<p style='margin-top:-14px'>틀렸던 단어들이에요:</p>" + retryHtml : ""}
      ${uniqueWrong.length > 0 ? '<button class="btn-review" id="reviewBtn">틀린 단어만 다시 풀기 📝</button>' : ""}
      <button class="btn-restart" id="restartBtn">같은 유닛 다시 풀기</button>
      <button class="btn-pick-again" id="pickAgainBtn">‹ 다른 유닛 선택하기</button>
    </div>
  `;

  const currentPool = [...new Set([...queue, ...wrongWords])];
  const lastPool = queue.length ? queue : [];

  document.getElementById("restartBtn").addEventListener("click", () => {
    startQuiz(lastFullPool);
  });
  document.getElementById("pickAgainBtn").addEventListener("click", () => {
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("selectScreen").classList.remove("hidden");
    document.getElementById("subTitle").textContent = "Unit 24~60 · 원하는 유닛을 골라 시작하세요";
  });
  if (uniqueWrong.length > 0) {
    document.getElementById("reviewBtn").addEventListener("click", () => {
      startQuiz(uniqueWrong);
    });
  }
}

let lastFullPool = [];
const _origStartQuiz = startQuiz;
startQuiz = function(pool) {
  lastFullPool = pool;
  _origStartQuiz(pool);
};

buildUnitGrid();
</script>

</body>
</html>
